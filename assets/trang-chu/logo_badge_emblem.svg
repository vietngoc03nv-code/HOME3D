<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <g transform="translate(1, 0)">
    <!-- Outer gold octagon -->
    <polygon points="25,2 47,13 49,36 38,48 25,51 12,48 1,36 3,13" 
             fill="none" stroke="url(#emblemGold)" stroke-width="2.2"/>
    <!-- Inner subtle ring -->
    <polygon points="25,6 43,15 45,34 35,44 25,47 15,44 5,34 7,15" 
             fill="none" stroke="#D97706" stroke-width="0.8" opacity="0.6"/>

    <!-- Stars -->
    <circle cx="25" cy="10" r="1.8" fill="url(#emblemGold)"/>
    <circle cx="17" cy="11.5" r="1.3" fill="url(#emblemGold)"/>
    <circle cx="33" cy="11.5" r="1.3" fill="url(#emblemGold)"/>
    <circle cx="11" cy="15" r="1.0" fill="url(#emblemGold)"/>
    <circle cx="39" cy="15" r="1.0" fill="url(#emblemGold)"/>

    <!-- Monogram LH -->
    <path d="M 16 20 L 16 38 L 24 38" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 26 20 L 26 38 M 35 20 L 35 38 M 26 29 L 35 29" fill="none" stroke="url(#emblemGold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom diamond accent -->
    <polygon points="25,41 27.5,43.5 25,46 22.5,43.5" fill="url(#emblemGold)"/>
  </g>
</svg>
