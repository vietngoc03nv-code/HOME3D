<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#05101E" flood-opacity="0.95"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- 1. Crest Shield Emblem with Luxury Dark Glass Underlay -->
    <g transform="translate(4, 3)">
      <polygon points="25,2 47,13 49,36 38,48 25,51 12,48 1,36 3,13" 
               fill="rgba(10, 25, 47, 0.75)" stroke="url(#gGold)" stroke-width="1.8"/>
      <polygon points="25,6 43,15 45,34 35,44 25,47 15,44 5,34 7,15" 
               fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>

      <!-- Stars / Architectural Facets -->
      <circle cx="25" cy="10" r="1.8" fill="url(#gGold)"/>
      <circle cx="17" cy="11.5" r="1.3" fill="url(#gGold)"/>
      <circle cx="33" cy="11.5" r="1.3" fill="url(#gGold)"/>
      <circle cx="11" cy="15" r="1.0" fill="url(#gGold)"/>
      <circle cx="39" cy="15" r="1.0" fill="url(#gGold)"/>

      <!-- LH Monogram -->
      <path d="M 16 20 L 16 38 L 24 38" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 26 20 L 26 38 M 35 20 L 35 38 M 26 29 L 35 29" fill="none" stroke="url(#gGold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Bottom Accent Diamond -->
      <polygon points="25,41 27.5,43.5 25,46 22.5,43.5" fill="url(#gGold)"/>
    </g>

    <!-- 2. Typography -->
    <g transform="translate(62, 5)">
      <!-- Main Brand Name -->
      <text x="0" y="27" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="22" font-weight="800" letter-spacing="2" fill="#FFFFFF">
        LUFFY <tspan fill="url(#gGold)">HOME</tspan>
      </text>

      <!-- Subtitle Accent Lines & DANANG -->
      <line x1="0" y1="38" x2="28" y2="38" stroke="url(#gGold)" stroke-width="1.2" opacity="0.9"/>
      <text x="34" y="41" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="9" font-weight="700" letter-spacing="3" fill="#FDE68A">
        DANANG
      </text>
      <line x1="112" y1="38" x2="140" y2="38" stroke="url(#gGold)" stroke-width="1.2" opacity="0.9"/>
    </g>
  </g>
</svg>
