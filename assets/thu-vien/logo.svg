<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56">
  <!-- Crest Emblem on the left: NO dark background fill, clean transparent -->
  <g transform="translate(6, 4)">
    <!-- Fine Diamond / Shield Outline -->
    <polygon points="25,2 47,13 49,36 38,48 25,51 12,48 1,36 3,13" 
             fill="none" stroke="#DF7627" stroke-width="1.8"/>
    <polygon points="25,6 43,15 45,34 35,44 25,47 15,44 5,34 7,15" 
             fill="none" stroke="#1A3254" stroke-width="0.8" opacity="0.6"/>

    <!-- 9 Stars/Facets in Gold/Amber -->
    <circle cx="25" cy="10" r="1.8" fill="#DF7627"/>
    <circle cx="17" cy="11.5" r="1.3" fill="#DF7627"/>
    <circle cx="33" cy="11.5" r="1.3" fill="#DF7627"/>
    <circle cx="11" cy="15" r="1.0" fill="#DF7627"/>
    <circle cx="39" cy="15" r="1.0" fill="#DF7627"/>

    <!-- Interlocking Monogram LH in Deep Royal Navy -->
    <!-- L -->
    <path d="M 16 20 L 16 38 L 24 38" fill="none" stroke="#1A3254" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- H -->
    <path d="M 26 20 L 26 38 M 35 20 L 35 38 M 26 29 L 35 29" fill="none" stroke="#DF7627" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Small Accent Diamond at bottom -->
    <polygon points="25,41 27.5,43.5 25,46 22.5,43.5" fill="#DF7627"/>
  </g>

  <!-- Typography on the right -->
  <g transform="translate(66, 6)">
    <!-- LUFFY HOME -->
    <text x="0" y="27" font-family="'Playfair Display', Georgia, 'Cinzel', serif" 
          font-size="24" font-weight="900" letter-spacing="2.2" fill="#1A3254">
      LUFFY <tspan fill="#DF7627">HOME</tspan>
    </text>

    <!-- Subtitle: TÒA NHÀ 9 TẦNG CAO CẤP in Navy with letter spacing -->
    <line x1="0" y1="36" x2="26" y2="36" stroke="#DF7627" stroke-width="1" opacity="0.8"/>
    <text x="32" y="39" font-family="'Montserrat', 'Roboto Condensed', sans-serif" 
          font-size="7.5" font-weight="700" letter-spacing="2.2" fill="#1A3254">
      TÒA NHÀ 9 TẦNG CAO CẤP
    </text>
    <line x1="150" y1="36" x2="176" y2="36" stroke="#DF7627" stroke-width="1" opacity="0.8"/>
  </g>
</svg>
