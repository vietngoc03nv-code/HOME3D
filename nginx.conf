# Nginx configuration for Clean URLs without .html
server {
    listen 80;
    server_name luffyhome.vn www.luffyhome.vn;
    root /path/to/Home3D;
    index index.html;

    # 1. 301 Redirect /index.html to /
    if ($request_uri ~* "^/index\.html$") {
        return 301 /;
    }

    # 2. 301 Redirect *.html to clean URL
    if ($request_uri ~* "^(.+)\.html$") {
        return 301 $1;
    }

    # 3. Clean URLs try_files
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
